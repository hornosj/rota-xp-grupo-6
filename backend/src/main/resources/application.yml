server:
  port: 8080

spring:
  application:
    name: copiloto
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:sqlite:${BANCO_ARQUIVO:./copiloto.db}?foreign_keys=on&journal_mode=WAL&synchronous=NORMAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1           # SQLite: um escritor por vez; evita SQLITE_BUSY
  servlet:
    multipart:                       # áudio da edição por voz
      max-file-size: ${whisper.tamanho-maximo-mb}MB
      max-request-size: ${whisper.tamanho-maximo-mb}MB

banco:
  tipo: ${BANCO_TIPO:sqlite}         # sqlite | memoria
  recriar-no-inicio: false           # true: reimporta a seed a cada startup (o reset da demo sempre reimporta)

springdoc:
  api-docs:
    path: /v3/api-docs

demo:
  data-referencia: 2026-10-10        # usar a data do pitch
  assessor-id: ass-001
  janela-alerta-novo-minutos: 10

copiloto:
  modo: ${COPILOTO_MODO:stub}        # stub | cache | record | live  (demo: cache)
  modelo: ${COPILOTO_MODELO:deepseek/deepseek-v4-pro}   # via OpenRouter; barato para testes
  cache-dir: ./llm-cache
  api-key: ${OPENROUTER_APIKEY:}     # sem chave, live/record viram stub
  max-tokens: 700                     # teto de tokens de saída por resposta (trava de crédito)
  limite-chamadas-dia: ${COPILOTO_LIMITE_DIA:100}   # trava de crédito: passou, cai no stub

# Embabel: provedor compatível com OpenAI apontando para o OpenRouter.
# Sem OPENROUTER_APIKEY a aplicação sobe com uma chave provisória (o Embabel exige alguma);
# as chamadas falham e o Copiloto cai no stub.
embabel:
  models:
    default-llm: ${copiloto.modelo}
  agent:
    platform:
      models:
        openai:
          custom:
            base-url: https://openrouter.ai/api
            api-key: ${OPENROUTER_APIKEY:sem-chave}
            models: ${copiloto.modelo},${radar.modelo-classificacao}
            max-attempts: 2
            backoff-millis: 500
            backoff-multiplier: 2.0
            backoff-max-interval: 2000

# Edição do cadastro por voz: o Whisper transcreve, o Copiloto propõe as mudanças e o assessor confirma.
# Qualquer API compatível com a /audio/transcriptions da OpenAI serve: OpenAI (padrão), Groq
# (WHISPER_URL=https://api.groq.com/openai/v1, WHISPER_MODELO=whisper-large-v3-turbo) ou um servidor local.
whisper:
  url: ${WHISPER_URL:https://api.openai.com/v1}
  modelo: ${WHISPER_MODELO:whisper-1}
  api-key: ${WHISPER_APIKEY:}        # sem chave, a transcrição responde 503 e o assessor digita o texto
  idioma: pt
  timeout-segundos: 60
  tamanho-maximo-mb: 25              # limite da API da OpenAI

edicao:
  idade-minima: 18
  idade-maxima: 120
  max-caracteres-campo: 120
  max-caracteres-transcricao: 4000

premissas:
  cdi-anual: 0.10                   # ILUSTRATIVO — ajustar para a taxa vigente antes do pitch
  fgc:
    limite-por-conglomerado: 250000
    teto-global: 1000000

principalidade:
  pesos:
    renda: 0.30
    movimentacao: 0.20
    contas-recorrentes: 0.15
    investimentos: 0.15
    cartao: 0.10
    credito: 0.10
  score-minimo-principal: 40

renda:
  meses-minimos: 3
  tolerancia-valor: 0.15
  meses-janela: 6
  meses-janela-custo: 3

alertas:
  saldo-parado-multiplo-custo: 1
  saldo-parado-minimo: 10000
  renda-fora-capacidade-minima: 2000
  exposicao-sem-garantia-max: 0.20
  exposicao-sem-garantia-alta: 0.35
  vencimento-dias: 30
  consentimento-expirando-dias: 15
  evento-vida-dias: 7
  reserva-meses-alvo: 6
  aporte-programado-fracao-sobra: 0.5

consentimento:
  prazo-dias: 365

onboarding:
  caminho-link: /onboarding/          # o front monta a URL absoluta com a origem
  idade-minima: 18
  suitability:                       # pontuação máxima (inclusive) de cada perfil; 5 perguntas de 1 a 4 pontos
    limite-conservador: 8
    limite-moderado: 12
    limite-arrojado: 16              # acima disso: AGRESSIVO

convite:
  link-base: ${CONVITE_LINK_BASE:http://localhost:3000/convite/}
  validade-horas: 48
  prazo-meses: 12

# Editar cliente: notas do assessor (áudio transcrito no navegador ou texto) viram contexto do Copiloto.
# O LLM só classifica a necessidade; o produto sai deste catálogo, por regra.
anotacoes:
  max-no-contexto: 5          # notas recentes que o LLM recebe
  max-caracteres: 2000
  catalogo:                   # revisao: quando o cliente já tem; sensivel: acolher antes de ofertar
    PROTECAO_VEICULO:
      nome: Seguro auto
      descricao: Cobertura para colisão, roubo e danos a terceiros; cotação com a corretora de seguros.
      revisao:
        nome: Revisão do seguro auto
        descricao: O cliente já tem seguro; ajudar a acionar o sinistro e conferir franquia, carro reserva e terceiros.
    PROTECAO_VIDA:
      nome: Seguro de vida
      descricao: Protege a renda da família se o cliente faltar ou ficar inválido.
      revisao:
        nome: Revisão do seguro de vida
        descricao: Conferir se o capital segurado e os beneficiários ainda fazem sentido com a família atual.
    PROTECAO_RESIDENCIAL:
      nome: Seguro residencial
      descricao: Cobre roubo, incêndio e danos elétricos ou por água no imóvel.
      revisao:
        nome: Revisão do seguro residencial
        descricao: O cliente já tem seguro; ajudar a acionar o sinistro e conferir as coberturas.
    SAUDE:
      nome: Seguro de vida com cobertura para doenças graves
      descricao: Indenização em dinheiro no diagnóstico, para custos que o plano de saúde não cobre.
      sensivel: true
      revisao:
        nome: Revisão das coberturas de saúde
        descricao: Conferir o que o plano e os seguros atuais cobrem no tratamento e reforçar a reserva.
    RESERVA_EMERGENCIA:
      nome: Reserva de emergência com liquidez diária
      descricao: Tesouro Selic ou CDB com liquidez diária, até cobrir 6 meses do custo de vida.
    EDUCACAO:
      nome: Plano para educação dos filhos
      descricao: Aporte mensal em previdência ou título indexado à inflação com vencimento na data da faculdade.
    APOSENTADORIA:
      nome: Previdência privada (PGBL ou VGBL)
      descricao: Acumulação de longo prazo com benefício fiscal; o tipo depende da declaração de IR.
    COMPRA_IMOVEL:
      nome: Carteira para a entrada do imóvel
      descricao: Renda fixa com vencimento próximo da data da compra, sem risco de mercado no resgate.
    COMPRA_VEICULO:
      nome: Carteira para a compra do veículo
      descricao: CDB ou LCI com vencimento na data da troca, para pagar à vista e negociar desconto.
    VIAGEM:
      nome: Investimento com liquidez para a viagem
      descricao: Renda fixa com liquidez ou vencimento antes da viagem.
    SUCESSAO:
      nome: Planejamento sucessório com VGBL
      descricao: Previdência fora do inventário, com beneficiários indicados.
    LUTO:
      nome: Apoio no inventário e revisão de beneficiários
      descricao: Sem oferta agora. Ajudar a resgatar previdência e seguros do falecido e revisar beneficiários.
      sensivel: true
    REORGANIZACAO_FINANCEIRA:
      nome: Reorganização financeira
      descricao: Mapear perdas e dívidas, montar uma reserva mínima e rever o perfil de risco antes de novos aportes.
      sensivel: true
    ALOCACAO_LIQUIDEZ:
      nome: Plano para o dinheiro novo
      descricao: Separar reserva, objetivos de curto prazo e de longo prazo antes de investir o valor recebido.
    AUMENTO_RENDA:
      nome: Aporte programado
      descricao: Direcionar parte do aumento para aporte mensal automático; PGBL se declarar IR completo.
    EMPREENDIMENTO:
      nome: Separação PF/PJ e caixa da empresa
      descricao: Conta PJ, caixa da empresa com liquidez diária e pró-labore definido.
    INTERNACIONAL:
      nome: Conta global e investimentos em dólar
      descricao: Moeda forte para custos fora do país, sem depender do câmbio do dia.

prioridade:
  fgc-base: 35
  fgc-por-20k: 1
  fgc-max-extra: 25
  fgc-teto-global: 10
  concentracao-base: 15
  concentracao-alta-extra: 10
  vencimento-base: 15
  vencimento-por-50k: 1
  vencimento-max-extra: 10
  saldo-parado-base: 10
  saldo-parado-por-10k: 1
  saldo-parado-max-extra: 10
  renda-fora: 10
  consentimento-expirando: 10
  reserva-insuficiente: 8
  evento-vida: 8
  bonus-so-investimentos: 5

# Radar de notícias (BE2-10). Classificação: referencia (gabarito curado, demo offline) | regras | llm
radar:
  classificacao: ${RADAR_CLASSIFICACAO:referencia}
  modelo-classificacao: ${RADAR_MODELO:openai/gpt-oss-120b}   # barato e com saída estruturada
  tamanho-lote: 10                                           # notícias por chamada ao LLM
  cron: "0 0 7,10,12,14,16,19 * * MON-FRI"                   # classificação (LLM em lotes): 6x por dia útil
  cron-coleta: "0 */30 * * * *"                              # coleta sem LLM: feeds curtos giram rápido
  worker-habilitado: true
  processar-no-inicio: true
  fracao-plena: 0.25
  pontos-minimos: 10
  pre-filtro: true                    # só manda ao LLM o que as regras acham financeiro
  max-clientes-por-noticia: 3          # na visão da carteira, uma notícia macro não domina a lista
  rss:
    habilitado: ${RADAR_RSS:false}          # feeds reais; a demo usa só as curadas (offline)
    max-itens-por-feed: 30
    timeout-segundos: 10
    feeds:                                   # título + resumo + link; o texto fica no site de origem
      - nome: InfoMoney
        url: https://www.infomoney.com.br/feed/
      - nome: CNN Brasil
        url: https://www.cnnbrasil.com.br/feed/
      - nome: Bloomberg Línea
        url: https://www.bloomberglinea.com.br/arc/outboundfeeds/rss/?outputType=xml

desagio:
  ipca-anual: 0.045                  # ILUSTRATIVO — usado para estimar títulos IPCA+
  selic-anual: 0.10                  # ILUSTRATIVO — usado para estimar títulos Selic+
  dias-por-ano: 365
  produtos-elegiveis: CDB,RDB,LCI,LCA,LC,TESOURO,DEBENTURE,CRI,CRA

rentabilidade:
  max-periodos: 120                  # subperíodos aceitos na simulação com aportes
